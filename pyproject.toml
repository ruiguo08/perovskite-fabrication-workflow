[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perovskite-deposition-bo"
dynamic = ["version"]
description = "Laboratory workflow and system of record for perovskite solar-cell fabrication"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "ruiguo08" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.111,<1",
  "matplotlib>=3.10,<4",
  "pydantic>=2.7,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.9,<1",
  "reportlab>=4.2,<5",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "aiosqlite>=0.20,<1",
  "httpx2>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
web = [
  "static-app/*.html",
  "static-app/**/*",
]

[tool.setuptools.dynamic]
version = { attr = "web.version.__version__" }

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[project.scripts]
perovskite-workflow-web = "web.app:main"
perovskite-workflow-admin = "web.admin_cli:main"
