name: Windows validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest-windows:
    runs-on: windows-latest
    name: windows-latest / Python 3.14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.12.1
      - name: Cache uv downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            ~\AppData\Local\uv\cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - run: uv sync --locked --extra test --no-dev --no-editable
      - run: uv run --no-sync python -m unittest discover -s tests -v
        env:
          # The real-Chrome suites run in the frontend job on Linux; skipping
          # them here cuts the Windows job roughly in half.
          PEROVSKITE_SKIP_BROWSER: "1"
